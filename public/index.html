    <div id="splash-screen">
      <div class="splash-content">
        <img
          class="splash-icon"
          src="%PUBLIC_URL%/brand/app-icon-512.png"
          alt="PocaPocket"
          width="128"
          height="128"
          decoding="async"
        />
        <div class="splash-text">PocaPocket</div>
        <div class="splash-subtext">@ kepcang</div>
        <div class="splash-loader">
          <div class="loader-dot"></div>

    </div>
